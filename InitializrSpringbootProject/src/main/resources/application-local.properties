spring.datasource.url=${DEMO_DB_URL}
spring.datasource.username=${DEMO_DB_USER}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Closed loopback endpoint: mail sending fails locally, cannot reach a real SMTP.
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
