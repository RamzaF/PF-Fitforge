<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Restablecer Contraseña - FitForge</title>
    </head>
    <body>
        <!-- Header -->
        <header th:replace="~{layout/plantilla :: header}"/>
        
        <!-- Hero Section -->
        <section class="position-relative hero-section">
            <div class="hero-bg position-absolute top-0 start-0 w-100" style="min-height: 50vh;">
                <div class="overlay-dark position-absolute top-0 start-0 w-100 h-100"></div>
                <img th:src="@{/uploads/Banner.PNG}" alt="Background" class="w-100 h-100 object-fit-cover position-absolute top-0 start-0">
            </div>
            <div class="position-relative hero-content d-flex align-items-center justify-content-center w-100" style="min-height: 50vh;">
                <div class="container text-center text-white py-5">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <h1 class="display-2 fw-bold mb-3 fade-in">RESTABLECER CONTRASEÑA</h1>
                            <p class="lead fs-3 mb-4 slide-up">Recupera el acceso a tu cuenta</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de restablecimiento -->
        <section class="py-5" style="background-color: #D9D9D9; min-height: 100%;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow-sm p-4 bg-white rounded">
                            <h2 class="text-center fw-bold mb-4">Ingresa tu correo</h2>
                            <!-- Mensaje de éxito -->
                            <div th:if="${message}" class="alert alert-success text-center" th:text="${message}">
                                Ve a tu correo a restablecer la contraseña.
                            </div>
                            <!-- Formulario (solo si no hay mensaje) -->
                            <div th:unless="${message}">
                                <p class="text-center text-muted mb-4">Te enviaremos un enlace para restablecer tu contraseña.</p>
                                <form th:action="@{/forgot-password}" method="post">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Correo Electrónico</label>
                                        <input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@fitforge.com" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar enlace</button>
                                </form>
                            </div>
                            <p class="text-center mt-3">Volver a <a href="/login" class="text-primary text-decoration-none">Iniciar Sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section> 

        <!-- Footer -->
        <footer th:replace="~{layout/plantilla :: footer}"/>
    </body>
</html>
