<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>FitForge — Tienda Deportiva</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"/>

        <section th:replace="~{Home/fragmentos :: hero-section}"></section>

        <main id="mainContent" class="main-container" tabindex="-1">
            <div class="store-header-bar">
                <div>
                    <h2 class="store-header-bar__title">Nuestra Colección</h2>
                    <p class="store-header-bar__subtitle">
                        Artículos activos en tienda con disponibilidad verificada por variante.
                    </p>
                </div>
                <a href="/tienda/listado" class="btn btn-outline-primary btn-sm">Ir al catálogo completo →</a>
            </div>

            <div th:if="${#lists.isEmpty(productos)}" class="empty-state">
                <p class="mb-2 text-secondary">Aún no hay productos disponibles en el catálogo.</p>
                <a href="/tienda/listado" class="btn btn-primary btn-sm">Explorar tienda</a>
            </div>

            <div class="product-grid" th:unless="${#lists.isEmpty(productos)}">
                <article class="product-card"
                         data-testid="catalog-product-card"
                         th:each="producto : ${productos}">
                    <div class="product-card__media">
                        <div class="product-card__top-badges">
                            <span th:if="${producto.existencias > 0}" class="status-badge status-badge--success">Disponible</span>
                            <span th:if="${producto.existencias <= 0}" class="status-badge status-badge--danger">Agotado</span>
                        </div>
                        <img th:src="${!#strings.isEmpty(producto.imagen)} ? @{${producto.imagen}} : @{/uploads/FitForge.png}"
                             class="product-card__img"
                             th:alt="${producto.descripcion}"
                             loading="lazy">
                    </div>
                    <div class="product-card__body">
                        <div>
                            <div class="product-card__category"
                                 th:text="${producto.categoria != null ? producto.categoria.descripcion : 'Catálogo'}">Categoría</div>
                            <h3 class="product-card__title" th:text="${producto.descripcion}">Producto</h3>
                        </div>
                        <div class="product-card__footer">
                            <span class="product-card__price price-tag"
                                  th:text="'₡ ' + ${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">₡ 0.00</span>
                            <a th:href="@{'/productos/' + ${producto.idProducto}}"
                               class="btn btn-primary btn-sm">Ver detalles</a>
                        </div>
                    </div>
                </article>
            </div>
        </main>

        <section class="brands-section">
            <div class="container">
                <div th:replace="~{Home/fragmentos :: brands-section}"></div>
            </div>
        </section>

        <footer th:replace="~{layout/plantilla :: footer}"/>
        <th:block th:replace="~{layout/plantilla :: scripts}"/>
    </body>
</html>
