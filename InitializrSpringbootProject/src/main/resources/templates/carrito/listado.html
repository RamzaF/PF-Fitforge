<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/plantilla :: head}">
    <title>Carrito</title>
</head>
<body>
<header th:replace="~{layout/plantilla :: header}"/>

<div class="container py-5">
    <h2>Carrito de Compras</h2>
    <div th:if="${items == null or items.isEmpty()}">
        <p>El carrito está vacío.</p>
    </div>
    <table class="table" th:unless="${items == null or items.isEmpty()}">
        <thead>
        <tr>
            <th>Producto</th>
            <th>Color/Talla</th>
            <th>Precio Unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.productoColorTalla?.producto?.descripcion ?: 'N/A'}"></td>
            <td>
                <span th:text="${item.productoColorTalla?.color?.nombre ?: 'N/A'}"></span> /
                <span th:text="${item.productoColorTalla?.talla?.nombre ?: 'N/A'}"></span>
            </td>
            <td>₡ <span th:text="${#numbers.formatDecimal(item.productoColorTalla?.producto?.precio, 0, 'COMMA', 2, 'POINT')}"></span></td>
            <td>
                <form th:action="@{/carrito/actualizar}" method="post" class="d-flex align-items-center">
                    <input type="hidden" name="id" th:value="${item.productoColorTalla.idProductoColorTalla}"/>

                    <input type="number" name="cantidad" th:value="${item.cantidad}" min="1"
                           th:max="${item.productoColorTalla?.existencias ?: 1}" class="form-control form-control-sm me-2" style="width: 70px;"/>
                    <button type="submit" class="btn btn-sm btn-primary">Actualizar</button>
                </form>
            </td>
            <td>₡ <span th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 2, 'POINT')}"></span></td>
            <td>
                <a th:href="@{/carrito/eliminar/{id}(id=${item.productoColorTalla.idProductoColorTalla})}" class="btn btn-sm btn-danger">Eliminar</a>

            </td>
        </tr>
        </tbody>
    </table>

    <div th:unless="${items == null or items.isEmpty()}">
        <h4>Total: ₡ <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')}"></span></h4>
    </div>
</div>

<footer th:replace="~{layout/plantilla :: footer}"/>
</body>
</html>
