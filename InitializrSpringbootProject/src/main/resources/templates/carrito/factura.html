<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/plantilla :: head}">
    <title>Factura - FitForge</title>
</head>
<body>
<header th:replace="~{layout/plantilla :: header}"/>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center">
                    <h2 class="mb-0">Factura generada</h2>
                </div>
                <div class="card-body">
                    <div class="mb-4 text-center">
                        <h4 class="fw-bold">N° Factura: <span th:text="${factura.idFactura}"></span></h4>
                        <p class="mb-1">Fecha: <span th:text="${#dates.format(factura.fecha, 'dd/MM/yyyy')}"></span></p>
                        <p class="mb-1">Estado: <span class="badge bg-info" th:text="${factura.estado}"></span></p>
                    </div>
                    <hr>
                    <h5 class="mb-3">Detalle de productos</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th>Color</th>
                                    <th>Talla</th>
                                    <th>Cantidad</th>
                                    <th>Precio unitario</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="venta : ${ventas}">
                                    <td th:text="${venta.productoColorTalla.producto.descripcion}"></td>
                                    <td th:text="${venta.productoColorTalla.color.nombreColor}"></td>
                                    <td th:text="${venta.productoColorTalla.talla.nombreTalla}"></td>
                                    <td th:text="${venta.cantidad}"></td>
                                    <td>₡ <span th:text="${#numbers.formatDecimal(venta.precio, 0, 'COMMA', 2, 'POINT')}"></span></td>
                                    <td>₡ <span th:text="${#numbers.formatDecimal(venta.precio * venta.cantidad, 0, 'COMMA', 2, 'POINT')}"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-end">
                        <h4 class="fw-bold">Total: ₡ <span th:text="${#numbers.formatDecimal(factura.total, 0, 'COMMA', 2, 'POINT')}"></span></h4>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a href="/carrito/ver" class="btn btn-primary">Volver al carrito</a>
                    <a href="/tienda/listado" class="btn btn-outline-success ms-2">Seguir comprando</a>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{layout/plantilla :: footer}"/>
</body>
</html>
