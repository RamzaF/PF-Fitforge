<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>FitForge</title>
    </head>
    <body>
        <!-- Hero compacto y sobrio -->
        <div th:fragment="hero-section" class="hero-banner-compact">
            <div class="container">
                <div class="row align-items-center gy-3">
                    <div class="col-lg-8">
                        <h1 class="hero-banner-compact__title">FitForge — Rendimiento y Estilo Deportivo</h1>
                        <p class="hero-banner-compact__lead mb-3">
                            Indumentaria técnica, suplementación y accesorios con consulta de tallas y colores disponibles.
                        </p>
                        <div class="d-flex flex-wrap gap-2">
                            <a href="/tienda/listado" class="btn btn-primary">Explorar Catálogo</a>
                            <a href="/register" class="btn btn-outline-light" sec:authorize="isAnonymous()">Crear cuenta</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:fragment="Banner" class="hero-banner-compact">
            <div class="container">
                <h1 class="hero-banner-compact__title">FitForge</h1>
                <p class="hero-banner-compact__lead mb-0">Forjando tu estilo deportivo.</p>
            </div>
        </div>

        <div th:fragment="cta-banner" class="py-4 bg-dark text-white text-center" sec:authorize="!hasRole('ROLE_ADMIN')">
            <div class="container">
                <h2 class="h4 fw-bold mb-2">Equipate para tu próximo entrenamiento</h2>
                <a href="/tienda/listado" class="btn btn-primary btn-sm">Ver productos disponibles</a>
            </div>
        </div>

        <!-- Marcas -->
        <div th:fragment="brands-section" class="brands-container">
            <div class="row align-items-center justify-content-center g-3">
                <div class="col-6 col-md-3 text-center">
                    <div class="brand-logo">
                        <img th:src="@{/uploads/gymshark-limited-logo.png}" alt="Gymshark" class="img-fluid">
                    </div>
                </div>
                <div class="col-6 col-md-3 text-center">
                    <div class="brand-logo">
                        <img th:src="@{/uploads/Youngla-Logo-Png-Vector.jpg}" alt="YoungLA" class="img-fluid">
                    </div>
                </div>
                <div class="col-6 col-md-3 text-center">
                    <div class="brand-logo">
                        <img th:src="@{/uploads/Pursue Fitness.jpeg}" alt="Pursue Fitness" class="img-fluid">
                    </div>
                </div>
                <div class="col-6 col-md-3 text-center">
                    <div class="brand-logo">
                        <img th:src="@{/uploads/Logo-black2_copy_110x.webp}" alt="Lazuli Label" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
