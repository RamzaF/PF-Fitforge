<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Agregar Administrador - FitForge</title>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <header th:replace="~{layout/plantilla :: header}"/>

        <main id="mainContent" class="main-container" tabindex="-1">
            <div th:replace="~{layout/plantilla :: adminSubnav('panel')}"></div>

            <div class="row justify-content-center py-2">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                    <div class="panel-card">
                        <div class="panel-card__header">
                            <h1 class="panel-card__title h5 mb-0">Nuevo Administrador</h1>
                        </div>
                        <div class="panel-card__body">
                            <form th:action="@{/usuario/guardar}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                    <div th:if="${errorUsername}" class="alert alert-danger mt-2 mb-0 py-2" role="alert">
                                        <span th:text="${errorUsername}"></span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                                </div>
                                <div class="mb-3">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="email" class="form-control" id="correo" name="correo" required>
                                    <div th:if="${errorCorreo}" class="alert alert-danger mt-2 mb-0 py-2" role="alert">
                                        <span th:text="${errorCorreo}"></span>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <a href="/admin" class="btn btn-outline-secondary">Volver</a>
                                    <button type="submit" class="btn btn-primary">Guardar Administrador</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/plantilla :: footer}"/>
        <th:block th:replace="~{layout/plantilla :: scripts}"/>
    </body>
</html>
