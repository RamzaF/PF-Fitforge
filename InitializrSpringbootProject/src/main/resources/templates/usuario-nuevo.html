<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Agregar Administrador - FitForge</title>
        <style>
            body {
                min-height: 100vh;
                margin: 0;
                padding: 0;
                font-family: 'Montserrat', sans-serif;
                background: linear-gradient(135deg, #D9D9D9 0%, #E6E6E6 100%);
            }
            .form-section {
                min-height: calc(100vh - 120px); /* Ajusta según header/footer */
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            .form-container {
                max-width: 420px;
                width: 100%;
            }
            .card {
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.10);
                padding: 32px 28px;
                margin: 0 auto;
            }
            h2 {
                text-align: center;
                font-weight: 700;
                margin-bottom: 24px;
            }
            .form-label {
                font-weight: 600;
                color: #444;
            }
            .form-control {
                border-radius: 8px;
                border: 1px solid #ccc;
                padding: 12px;
                transition: border-color 0.3s ease, box-shadow 0.3s ease;
            }
            .form-control:focus {
                border-color: #007bff;
                box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
                outline: none;
            }
            .btn-primary {
                background: #007bff;
                border: none;
                border-radius: 8px;
                padding: 12px;
                font-weight: 600;
                transition: background 0.3s ease, transform 0.2s ease;
            }
            .btn-primary:hover {
                background: #0056b3;
                transform: scale(1.05);
            }
            .btn-secondary {
                background: #6c757d;
                border: none;
                border-radius: 8px;
                padding: 12px;
                font-weight: 600;
                color: #fff;
                transition: background 0.3s ease, transform 0.2s ease;
            }
            .btn-secondary:hover {
                background: #5a6268;
                transform: scale(1.05);
            }
            .alert-danger {
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                border-radius: 8px;
                padding: 10px;
                margin-bottom: 15px;
                font-size: 0.9em;
            }
            @media (max-width: 576px) {
                .form-container {
                    padding: 15px;
                }
                .card {
                    padding: 20px;
                }
                h2 {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <!-- Header -->
        <header th:replace="~{layout/plantilla :: header}"/>
        <!-- Sección de formulario centrado -->
        <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
            <div class="row w-100 justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                    <div class="card shadow p-4 my-5">
                        <h2 class="text-center mb-4">Nuevo Administrador</h2>
                        <form th:action="@{/usuario/guardar}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                                <div th:if="${errorUsername}" class="alert-danger">
                                    <span th:text="${errorUsername}"></span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" class="form-control" id="correo" name="correo" required>
                                <div th:if="${errorCorreo}" class="alert-danger">
                                    <span th:text="${errorCorreo}"></span>
                                </div>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                            <div class="text-center">
                                <a href="/admin" class="btn btn-secondary">Volver</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer th:replace="~{layout/plantilla :: footer}"/>
        <div th:replace="~{layout/plantilla :: scripts}"/>
    </body>
</html>
