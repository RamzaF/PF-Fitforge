<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Nuevo Producto'"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="container mt-4">
        <h1 th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Agregar Nuevo Producto'"></h1>
        <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            <input type="hidden" th:field="*{idProducto}" />
            <div class="mb-3">
                <label for="idCategoria" class="form-label">Categoría ID</label>
                <input type="number" th:field="*{idCategoria}" class="form-control" id="idCategoria" required />
                <div class="invalid-feedback">Por favor, ingresa el ID de la categoría.</div>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <input type="text" th:field="*{descripcion}" class="form-control" id="descripcion" required />
                <div class="invalid-feedback">La descripción es obligatoria.</div>
            </div>
            <div class="mb-3">
                <label for="detalle" class="form-label">Detalle</label>
                <textarea th:field="*{detalle}" class="form-control" id="detalle" rows="3" required></textarea>
                <div class="invalid-feedback">El detalle es obligatorio.</div>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" id="precio" required />
                <div class="invalid-feedback">El precio es obligatorio.</div>
            </div>
            <div class="mb-3">
                <label for="existencias" class="form-label">Existencias</label>
                <input type="number" th:field="*{existencias}" class="form-control" id="existencias" required />
                <div class="invalid-feedback">Las existencias son obligatorias.</div>
            </div>
            <div class="mb-3">
                <label for="archivo" class="form-label">Imagen del Producto</label>
                <input type="file" name="archivo" class="form-control" id="archivo" />
                <div th:if="${producto.rutaImagen}" class="mt-2">
                    <img th:src="${producto.rutaImagen}" alt="Imagen actual" style="max-width: 200px;" />
                </div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activo" />
                <label for="activo" class="form-check-label">Activo</label>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/admin/productos}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
