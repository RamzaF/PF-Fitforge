<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Categoría: ' + ${categoria}"></title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
</head>
<body>

    <header th:replace="~{layout/plantilla :: header}"></header>

    <div class="container mt-4">
        <h1 class="text-center" th:text="'Productos en la categoría: ' + ${categoria}"></h1>

        <div th:if="${productos.empty}" class="alert alert-warning text-center">
            <p>No hay productos disponibles en esta categoría.</p>
        </div>

        <div class="row mt-4">
            <div class="col-md-4 mb-4" th:each="producto : ${productos}">
                <div class="card">
                    <img th:src="@{${producto.imagen}}" class="card-img-top" alt="Imagen del producto">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${producto.descripcion}"></h5>
                        <p class="card-text" th:text="${producto.detalle}"></p>
                        <p class="card-text"><strong>Precio: </strong> ₡<span th:text="${producto.precio}"></span></p>
                        <a href="#" class="btn btn-primary">Agregar al carrito</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout/plantilla :: footer}"></footer>

</body>
</html>
