<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Fitforge</title>
    </head>
    <body>
        <!-- Fragmento para la sección "Visita Nuestra Tienda" -->
        <div th:fragment="contacto">
            <h2 class="text-center mb-5 fw-bold section-title">Visita Nuestra Tienda</h2>
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <i class="bi bi-geo-alt-fill" style="font-size: 2rem; color: #2ECC71;"></i>
                    <div class="mt-4">
                        <p class="fw-bold">Dirección</p>
                        <p>San José, Costa Rica</p>
                    </div>
                    <div class="mt-3">
                        <p class="fw-bold">Teléfono</p>
                        <p>+506 2222-3333</p>
                    </div>
                    <div class="mt-3">
                        <p class="fw-bold">Email</p>
                        <p>info@fitforge.com</p>
                    </div>
                    <div class="mt-3">
                        <p class="fw-bold">Horario de atención</p>
                        <p>Lunes a Viernes: 9:00 - 18:00<br>Sábado: 10:00 - 14:00</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fragmento para la sección "Contáctanos" -->
        <div th:fragment="contacto-formulario">
            <h2 class="text-center mb-5 fw-bold section-title">Contáctanos</h2>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <p class="alert alert-info">El formulario de contacto todavía no está habilitado.</p>
                </div>
            </div>
        </div>
    </body>
</html>
