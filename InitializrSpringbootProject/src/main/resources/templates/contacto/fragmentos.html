<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Contacto - FitForge</title>
    </head>
    <body>
        <div th:fragment="contacto" class="panel-card h-100">
            <div class="panel-card__header">
                <h1 class="panel-card__title">Información de Contacto</h1>
            </div>
            <div class="panel-card__body">
                <dl class="kv-grid">
                    <div style="grid-column: 1 / -1;">
                        <dt>Ubicación</dt>
                        <dd>San José, Costa Rica</dd>
                    </div>
                    <div>
                        <dt>Teléfono</dt>
                        <dd class="tabular-nums">+506 2222-3333</dd>
                    </div>
                    <div>
                        <dt>Correo</dt>
                        <dd>info@fitforge.com</dd>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <dt>Horario</dt>
                        <dd>Lunes a Viernes: 9:00 – 18:00 · Sábado: 10:00 – 14:00</dd>
                    </div>
                </dl>
            </div>
        </div>

        <div th:fragment="contacto-formulario" class="panel-card h-100">
            <div class="panel-card__header">
                <h2 class="panel-card__title">Mensajería en Línea</h2>
            </div>
            <div class="panel-card__body">
                <p class="alert alert-info mb-0">El formulario de contacto todavía no está habilitado.</p>
            </div>
        </div>
    </body>
</html>
