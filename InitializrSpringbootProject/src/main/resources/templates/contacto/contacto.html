<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Contacto - FitForge</title>
    </head>
    <body>
        <!-- Header -->
        <header th:replace="~{layout/plantilla :: header}"/>
        
        <!-- Hero Section -->
        <section class="position-relative hero-section">
            <div th:replace="~{layout/plantilla :: Banner-p}"/>
        </section>

        <!-- Sección de contacto y formulario alineados horizontalmente -->
        <section class="py-5" style="background-color: #D9D9D9; min-height: 100%;">
            <div class="container-fluid p-0" >
                <div class="row g-0">
                    <!-- Fragmento contacto (40% del ancho) con fondo gris -->
                    <div class="col-md-5 col-lg-4" >
                        <div th:replace="~{contacto/fragmentos :: contacto}"></div>
                    </div>
                    <!-- Fragmento contacto-formulario (60% del ancho) -->
                    <div class="col-md-7 col-lg-8">
                        <div th:replace="~{contacto/fragmentos :: contacto-formulario}"></div>
                    </div>
                </div>
            </div>
        </section> 

        <!-- Footer -->
        <footer th:replace="~{layout/plantilla :: footer}"/>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
    </body>
</html>
