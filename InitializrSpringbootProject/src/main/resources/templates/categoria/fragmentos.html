<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
    <head>
        <title>Categoría - FitForge</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div th:fragment="listado-categoria">
            <div class="store-header-bar">
                <div>
                    <div class="small text-secondary fw-semibold mb-1">Categoría del catálogo</div>
                    <h1 class="store-header-bar__title" th:text="${categoria}">Categoría</h1>
                </div>
                <a th:href="@{/tienda/listado}" class="btn btn-outline-secondary btn-sm">← Ver todo el catálogo</a>
            </div>

            <div th:if="${productos.empty}" class="empty-state">
                <p class="mb-3 text-secondary">No hay productos disponibles en esta categoría.</p>
                <a th:href="@{/tienda/listado}" class="btn btn-primary btn-sm">Explorar otras categorías</a>
            </div>

            <div class="product-grid" th:unless="${productos.empty}">
                <article class="product-card"
                         data-testid="catalog-product-card"
                         th:each="producto : ${productos}">
                    <div class="product-card__media">
                        <div class="product-card__top-badges">
                            <span th:if="${producto.existencias > 0}" class="status-badge status-badge--success">Disponible</span>
                            <span th:if="${producto.existencias <= 0}" class="status-badge status-badge--danger">Agotado</span>
                        </div>
                        <img th:src="${!#strings.isEmpty(producto.imagen)} ? @{${producto.imagen}} : @{/uploads/FitForge.png}"
                             class="product-card__img"
                             th:alt="${producto.descripcion}"
                             loading="lazy">
                    </div>
                    <div class="product-card__body">
                        <div>
                            <div class="product-card__category" th:text="${categoria}">Categoría</div>
                            <h2 class="product-card__title" th:text="${producto.descripcion}">Producto</h2>
                        </div>
                        <div class="product-card__footer">
                            <span class="product-card__price price-tag"
                                  th:text="'₡ ' + ${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">₡ 0.00</span>
                            <a th:href="@{'/productos/' + ${producto.idProducto}}" class="btn btn-primary btn-sm">
                                Ver detalles
                            </a>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </body>
</html>
