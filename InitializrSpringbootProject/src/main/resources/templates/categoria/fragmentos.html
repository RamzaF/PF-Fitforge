<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div th:fragment="listado-categoria" >
            <div class="container mt-5 mb-5">
                <h1 class="text-center mb-4" th:text="'Productos en la categoría: ' + ${categoria}"></h1>

                <div th:if="${productos.empty}" class="alert alert-warning text-center">
                    <p>No hay productos disponibles en esta categoría.</p>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-4" th:each="producto : ${productos}">
                        <div class="card h-100 shadow-sm">
                            <div class="overflow-hidden">
                                    <!-- Imagen con efecto hover, tamaño aumentado -->
                                    <img th:src="${!#strings.isEmpty(producto.imagen)} ? @{${producto.imagen}} : @{/uploads/FitForge.png}"
                                         class="card-img-top product-img" th:alt="${producto.descripcion}" style="height: 300px; object-fit: cover; width: 100%;">
                                </div>
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title" th:text="${producto.descripcion}"></h5>
                                <p class="card-text flex-grow-1" th:text="${producto.detalle}"></p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <span class="h5 mb-0">₡<span th:text="${producto.precio}"></span></span>
                                    <a th:href="@{'/productos/' + ${producto.idProducto}}" class="btn btn-primary">
                                        <i class="bi bi-cart-plus"></i> Agregar al carrito
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
    </body>
</html>
