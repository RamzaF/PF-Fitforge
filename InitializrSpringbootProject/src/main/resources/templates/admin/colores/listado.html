<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Admin - Gestión de Colores - FitForge</title>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <header th:replace="~{layout/plantilla :: header}"></header>

        <main id="mainContent" class="main-container" tabindex="-1">
            <div th:replace="~{layout/plantilla :: adminSubnav('colores')}"></div>

            <div th:if="${mensaje != null}"
                 th:class="'alert alert-' + (${tipo} ?: 'info') + ' alert-dismissible fade show'"
                 role="alert">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div class="store-header-bar">
                <div>
                    <h1 class="store-header-bar__title">Gestión de Colores</h1>
                    <p class="store-header-bar__subtitle">
                        Administrá los colores disponibles para las variantes de productos.
                    </p>
                </div>
                <span class="status-badge status-badge--info tabular-nums"
                      th:text="${#lists.size(colores) + ' colores'}">0 colores</span>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="panel-card">
                        <div class="panel-card__header">
                            <h2 class="panel-card__title" th:text="${colorForm.idColor != null ? 'Editar Color' : 'Nuevo Color'}">Nuevo Color</h2>
                        </div>
                        <div class="panel-card__body">
                            <form th:action="@{/admin/colores/guardar}" method="post">
                                <input type="hidden" name="idColor" th:value="${colorForm.idColor}" />
                                <div class="mb-3">
                                    <label for="nombreColor" class="form-label">Nombre del color <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombreColor" name="nombreColor"
                                           th:value="${colorForm.nombreColor}" required minlength="1" maxlength="50"
                                           placeholder="Ej. Negro" />
                                    <div class="field-hint">Entre 1 y 50 caracteres. Sin duplicados.</div>
                                </div>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="activo" name="activo" value="true"
                                           th:checked="${colorForm.activo}" />
                                    <label class="form-check-label" for="activo">Color activo</label>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary"
                                            th:text="${colorForm.idColor != null ? 'Guardar cambios' : 'Crear color'}">Guardar</button>
                                    <a th:if="${colorForm.idColor != null}" th:href="@{/admin/colores/listado}"
                                       class="btn btn-outline-secondary">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="panel-card">
                        <div class="panel-card__header">
                            <h2 class="panel-card__title">Colores Registrados</h2>
                            <span class="status-badge status-badge--neutral tabular-nums" th:text="${#lists.size(colores)}">0</span>
                        </div>
                        <div class="table-wrap">
                            <table class="data-table data-table--stack" aria-label="Listado de colores">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Estado</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(colores)}">
                                        <td colspan="4" class="text-center py-4 text-secondary">No hay colores registrados todavía.</td>
                                    </tr>
                                    <tr th:each="color : ${colores}">
                                        <td data-label="ID" class="tabular-nums fw-bold" th:text="${color.idColor}">1</td>
                                        <td data-label="Nombre" class="fw-semibold" th:text="${color.nombreColor}">Color</td>
                                        <td data-label="Estado">
                                            <span th:if="${color.activo}" class="status-badge status-badge--success">Activo</span>
                                            <span th:unless="${color.activo}" class="status-badge status-badge--neutral">Inactivo</span>
                                        </td>
                                        <td data-label="Acciones" class="text-end">
                                            <div class="d-inline-flex gap-1 justify-content-end">
                                                <a th:href="@{/admin/colores/listado(editarId=${color.idColor})}"
                                                   class="btn btn-sm btn-outline-primary">Editar</a>
                                                <form th:action="@{/admin/colores/estado}" method="post" class="d-inline">
                                                    <input type="hidden" name="idColor" th:value="${color.idColor}" />
                                                    <input type="hidden" name="activo" th:value="${!color.activo}" />
                                                    <button type="submit"
                                                            th:class="${color.activo} ? 'btn btn-sm btn-outline-warning' : 'btn btn-sm btn-outline-success'"
                                                            th:text="${color.activo} ? 'Desactivar' : 'Activar'">Estado</button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
    </body>
</html>
