<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Admin - Gestión de Productos</title>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <header th:replace="~{layout/plantilla :: header}"></header>
        
        <div class="container py-5">
            <div th:if="${mensaje != null}"
                 th:class="'alert alert-' + (${tipo} ?: 'info') + ' alert-dismissible fade show'"
                 role="alert">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div class="row mb-4">
                <div class="col d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <div>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a th:href="@{/admin}">Administración</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Productos</li>
                            </ol>
                        </nav>
                        <h1 class="mb-2">Gestión de Productos</h1>
                        <p class="text-muted mb-0">Administrá tu catálogo de productos: añadí, editá y activá o desactivá artículos y sus variantes.</p>
                    </div>
                    <div class="btn-group" role="group" aria-label="Navegación de catálogo">
                        <a th:href="@{/admin/categorias/listado}" class="btn btn-outline-secondary">Categorías</a>
                        <a th:href="@{/admin/colores/listado}" class="btn btn-outline-secondary">Colores</a>
                        <a th:href="@{/admin/tallas/listado}" class="btn btn-outline-secondary">Tallas</a>
                    </div>
                </div>
            </div>
            
            <div class="row mb-4">
                <div class="col">
                    <!-- Barra de búsqueda y filtros -->
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <form th:action="@{/admin/productos/buscar}" method="get" class="d-flex">
                                        <input type="text" name="termino" class="form-control" placeholder="Buscar productos..." th:value="${param.termino}">
                                        <button type="submit" class="btn btn-primary ms-2">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </form>
                                </div>
                                <div class="col-md-6 text-md-end">
                                    <!-- Botón para agregar nuevo producto -->
                                    <div th:replace="~{admin/productos/fragmentos :: botonAgregar}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Listado de productos -->
                    <div th:replace="~{admin/productos/fragmentos :: listadoProductos}"></div>
                </div>
            </div>
        </div>
        
        <!-- Modal para agregar nuevo producto -->
        <div th:replace="~{admin/productos/fragmentos :: modalNuevoProducto}"></div>
        
        <!-- Footer -->
        <footer th:replace="~{layout/plantilla :: footer}"></footer>
        
        <!-- Incluir scripts de la plantilla -->
        <th:block th:replace="~{layout/plantilla :: scripts}"/>
        
        <!-- Scripts específicos para esta página -->
        <script>
                // Inicialización de elementos interactivos
                var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
                var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                    return new bootstrap.Tooltip(tooltipTriggerEl)
                });
                
                // Mostrar mensajes de error o éxito si existen
                const urlParams = new URLSearchParams(window.location.search);
                const mensaje = urlParams.get('mensaje');
                const tipo = urlParams.get('tipo');
                
                if (mensaje) {
                    // Crear alerta
                    const alerta = document.createElement('div');
                    alerta.className = `alert alert-${tipo || 'info'} alert-dismissible fade show`;
                    alerta.role = 'alert';
                    alerta.innerHTML = mensaje + 
                        '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
                    
                    // Insertar alerta al inicio del contenedor
                    const container = document.querySelector('.container');
                    container.insertBefore(alerta, container.firstChild);
                    
                    // Auto cerrar después de 5 segundos
                    setTimeout(() => {
                        const bsAlert = new bootstrap.Alert(alerta);
                        bsAlert.close();
                    }, 5000);
                }
        </script>
    </body>
</html>
