<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Admin - Gestión de Productos - FitForge</title>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <header th:replace="~{layout/plantilla :: header}"></header>

        <main id="mainContent" class="main-container" tabindex="-1">
            <div th:replace="~{layout/plantilla :: adminSubnav('productos')}"></div>

            <div th:if="${mensaje != null}"
                 th:class="'alert alert-' + (${tipo} ?: 'info') + ' alert-dismissible fade show'"
                 role="alert">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div class="store-header-bar">
                <div>
                    <h1 class="store-header-bar__title">Gestión de Productos</h1>
                    <p class="store-header-bar__subtitle">
                        Creá, editá y activá o desactivá artículos y sus combinaciones de variantes.
                    </p>
                </div>
                <div th:replace="~{admin/productos/fragmentos :: botonAgregar}"></div>
            </div>

            <!-- Barra compacta de búsqueda administrativa -->
            <div class="panel-card mb-3">
                <div class="panel-card__body py-3">
                    <form th:action="@{/admin/productos/buscar}" method="get" class="row g-2 align-items-center">
                        <div class="col-md-8">
                            <label for="adminBuscarProd" class="visually-hidden">Buscar productos</label>
                            <input type="text"
                                   id="adminBuscarProd"
                                   name="termino"
                                   class="form-control"
                                   placeholder="Buscar por nombre o descripción..."
                                   th:value="${terminoBusqueda != null ? terminoBusqueda : param.termino}">
                        </div>
                        <div class="col-md-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-search" aria-hidden="true"></i>
                                <span>Buscar</span>
                            </button>
                            <a th:href="@{/admin/productos/listado}" class="btn btn-outline-secondary">Limpiar</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Listado de productos -->
            <div th:replace="~{admin/productos/fragmentos :: listadoProductos}"></div>
        </main>

        <!-- Modal para agregar nuevo producto -->
        <div th:replace="~{admin/productos/fragmentos :: modalNuevoProducto}"></div>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>
        <th:block th:replace="~{layout/plantilla :: scripts}"/>
    </body>
</html>
