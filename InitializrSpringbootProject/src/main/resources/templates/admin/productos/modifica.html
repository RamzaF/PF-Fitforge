<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:replace="layout/plantilla :: head">
        <title>Admin - Editar Producto</title>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <header th:replace="layout/plantilla :: header"></header>
        
        <div class="container py-5">
            <div class="row mb-4">
                <div class="col">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/admin}">Administración</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/admin/productos/listado}">Productos</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Editar Producto</li>
                        </ol>
                    </nav>
                    <h1 class="mb-3">Editar Producto</h1>
                    <p class="text-muted">Actualice la información del producto. Los cambios se reflejarán inmediatamente en la tienda.</p>
                </div>
            </div>
            
            <!-- Mensajes de alerta para errores o éxitos -->
            <div th:if="${mensaje != null}" class="alert alert-dismissible fade show" th:classappend="${tipo != null ? 'alert-' + tipo : 'alert-info'}" role="alert">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <div class="row mb-4">
                <div class="col">
                    <!-- Formulario de edición de producto -->
                    <div th:replace="admin/productos/fragmentos :: formularioEdicion"></div>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <footer th:replace="layout/plantilla :: footer"></footer>
        
        <!-- Scripts específicos para esta página -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Inicialización de elementos interactivos
                var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
                var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                    return new bootstrap.Tooltip(tooltipTriggerEl)
                });
                
                // Validación de formato de imagen
                const inputImagen = document.getElementById('imagen');
                if (inputImagen) {
                    inputImagen.addEventListener('change', function() {
                        const file = this.files[0];
                        if (file) {
                            const fileType = file.type;
                            const validImageTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/jpg'];
                            if (!validImageTypes.includes(fileType)) {
                                alert('Por favor, seleccione un archivo de imagen válido (JPG, JPEG, PNG, GIF)');
                                this.value = '';
                                return false;
                            }
                            
                            // Validar tamaño (5MB máximo)
                            const fileSize = file.size / 1024 / 1024; // en MB
                            if (fileSize > 5) {
                                alert('El tamaño del archivo excede el límite de 5MB');
                                this.value = '';
                                return false;
                            }
                        }
                    });
                }
            });
        </script>
    </body>
</html>
