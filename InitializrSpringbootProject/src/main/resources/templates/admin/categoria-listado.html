<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Productos por Categoría - FitForge</title>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <header th:replace="~{layout/plantilla :: header}"></header>

        <main id="mainContent" class="main-container" tabindex="-1">
            <div th:replace="~{layout/plantilla :: adminSubnav('productos')}"></div>

            <div class="store-header-bar">
                <div>
                    <h1 class="store-header-bar__title" th:text="${'Productos — ' + categoria}">Productos por Categoría</h1>
                    <p class="store-header-bar__subtitle">Administrá los productos de esta categoría o su inventario por variante.</p>
                </div>
                <a th:href="@{/admin/productos/listado}" class="btn btn-outline-primary btn-sm">Ir a todos los productos</a>
            </div>

            <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(productos)}">
                <p class="mb-3 text-secondary">No hay productos disponibles en esta categoría.</p>
                <a th:href="@{/admin/productos/listado}" class="btn btn-primary btn-sm">Ir a productos</a>
            </div>

            <div class="product-grid" th:if="${not #lists.isEmpty(productos)}">
                <article class="product-card" th:each="producto : ${productos}">
                    <div class="product-card__media">
                        <img th:src="${!#strings.isEmpty(producto.rutaImagen)} ? @{${producto.rutaImagen}} : @{/uploads/FitForge.png}"
                             class="product-card__img"
                             th:alt="${producto.descripcion}">
                    </div>
                    <div class="product-card__body">
                        <div>
                            <div class="product-card__category" th:text="${producto.categoria.descripcion}">Categoría</div>
                            <h2 class="product-card__title" th:text="${producto.descripcion}">Producto</h2>
                        </div>
                        <div class="product-card__footer">
                            <span class="product-card__price price-tag"
                                  th:text="${'₡ ' + #numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">₡ 0.00</span>
                            <div class="d-flex gap-1">
                                <a th:href="@{/admin/productos/editar/{id}(id=${producto.idProducto})}" class="btn btn-primary btn-sm">Editar</a>
                                <a th:href="@{/admin/productos/inventario/{id}(id=${producto.idProducto})}" class="btn btn-outline-secondary btn-sm">Inventario</a>
                            </div>
                        </div>
                    </div>
                </article>
            </div>
        </main>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
    </body>
</html>
