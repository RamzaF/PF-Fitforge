<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title th:text="|Detalles de ${producto.descripcion} - FitForge|">Detalles del Producto</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"/>
        
        <section class="products-catalog py-5">
            <div class="container">
                <div class="row g-4">
                    <!-- Aside a la izquierda (imágenes) -->
                    <div class="col-md-4">
                        <aside th:replace="~{productos/fragmentos :: aside}"/>
                    </div>
                    <!-- Detalles del producto a la derecha -->
                    <div class="col-md-8">
                        <section th:replace="~{productos/fragmentos :: product-details}"/>
                    </div>
                </div>
            </div>
        </section>
        
        <footer th:replace="~{layout/plantilla :: footer}"/>
    </body>
</html>
