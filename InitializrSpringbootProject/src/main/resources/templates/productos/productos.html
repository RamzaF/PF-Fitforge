<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title th:text="|Detalles de ${producto.descripcion} - FitForge|">Detalles del Producto</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"/>
        <main id="mainContent" class="main-container" tabindex="-1">
            <section th:replace="~{productos/fragmentos :: product-details}"/>
        </main>
        <footer th:replace="~{layout/plantilla :: footer}"/>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
    </body>
</html>
