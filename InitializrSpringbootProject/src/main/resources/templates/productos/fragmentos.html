<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Detalle de Producto - FitForge</title>
    </head>
    <body>
        <!-- Fragmento conservado por compatibilidad si otra vista lo referencia -->
        <aside th:fragment="aside" class="aside-images">
            <img th:src="${!#strings.isEmpty(producto.imagen)} ? @{${producto.imagen}} : @{/uploads/FitForge.png}"
                 th:alt="${producto.descripcion}"
                 class="detail-media__img">
        </aside>

        <!-- Vista principal refinada de detalle de producto (sin duplicar imagen) -->
        <section th:fragment="product-details" class="product-details-section">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <a th:href="@{/tienda/listado}" class="btn btn-outline-secondary btn-sm">
                    ← Volver al catálogo
                </a>
                <a th:if="${producto.categoria != null}"
                   th:href="@{/categoria/{nombre}(nombre=${producto.categoria.descripcion})}"
                   class="status-badge status-badge--info text-decoration-none"
                   th:text="${producto.categoria.descripcion}">Categoría</a>
            </div>

            <div class="detail-card">
                <div class="detail-grid">
                    <div class="detail-media">
                        <img data-testid="detail-main-image"
                             th:src="${!#strings.isEmpty(producto.imagen)} ? @{${producto.imagen}} : @{/uploads/FitForge.png}"
                             th:alt="${producto.descripcion}"
                             class="detail-media__img">
                    </div>

                    <div class="detail-content">
                        <div class="product-card__category"
                             th:text="${producto.categoria != null ? producto.categoria.descripcion : 'Catálogo'}">Categoría</div>
                        <h1 class="detail-title" th:text="${producto.descripcion}">Nombre del Producto</h1>
                        <p class="detail-price price-tag"
                           th:text="'₡ ' + ${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">₡ 0.00</p>
                        <p class="text-secondary mb-4" th:text="${producto.detalle}">Descripción detallada del artículo.</p>

                        <!-- Vista para administradores -->
                        <div th:if="${esAdmin}">
                            <a th:href="@{'/admin/productos/editar/' + ${producto.idProducto}}" class="btn btn-primary">
                                Editar producto
                            </a>
                        </div>

                        <!-- Vista de compra para clientes -->
                        <div th:if="${!esAdmin}">
                            <div th:if="${#lists.isEmpty(variantesActivas)}" class="alert alert-warning" role="alert">
                                Este producto aún no tiene variantes disponibles.
                            </div>

                            <!-- Píldoras rápidas de combinación y stock sincronizadas con el select contractual -->
                            <div th:unless="${#lists.isEmpty(variantesActivas)}" class="mb-3">
                                <span class="form-label d-block">Combinaciones registradas (Color / Talla y Stock):</span>
                                <div class="variant-pills" role="group" aria-label="Seleccionar combinación de color y talla">
                                    <button type="button"
                                            class="variant-pill"
                                            data-testid="variant-pill"
                                            th:each="pct : ${variantesActivas}"
                                            th:attr="data-variant-id=${pct.idProductoColorTalla},data-variant-stock=${pct.existencias != null ? pct.existencias : 0},aria-pressed='false'"
                                            th:disabled="${pct.existencias == null or pct.existencias == 0}">
                                        <span th:text="${(pct.color != null ? pct.color.nombreColor : 'Sin color') + ' / ' + (pct.talla != null ? pct.talla.nombreTalla : 'Única')}">Color / Talla</span>
                                        <span class="status-badge"
                                              th:classappend="${pct.existencias == null or pct.existencias == 0} ? ' status-badge--danger' : (${pct.existencias <= 5} ? ' status-badge--warning' : ' status-badge--success')"
                                              th:text="${(pct.existencias == null or pct.existencias == 0) ? 'Agotado (0)' : ('Stock: ' + pct.existencias)}">Stock</span>
                                    </button>
                                </div>
                            </div>

                            <form th:action="@{/carrito/agregar}"
                                  method="post"
                                  id="agregarCarritoForm"
                                  class="p-3 rounded border"
                                  style="background-color: var(--ff-surface-subtle);">
                                <div class="row g-3 align-items-end">
                                    <div class="col-md-7">
                                        <label for="variante" class="form-label">Color / Talla</label>
                                        <select id="variante" name="id" class="form-select" required>
                                            <option value="">Seleccioná una variante</option>
                                            <option th:each="pct : ${variantesActivas}"
                                                    th:value="${pct.idProductoColorTalla}"
                                                    th:attr="data-stock=${pct.existencias != null ? pct.existencias : 0}"
                                                    th:disabled="${pct.existencias == null or pct.existencias == 0}"
                                                    th:text="${(pct.color != null ? pct.color.nombreColor : 'Sin color') + ' / ' + (pct.talla != null ? pct.talla.nombreTalla : 'Única') + ' — Stock: ' + pct.existencias}"></option>
                                        </select>
                                    </div>
                                    <div class="col-6 col-md-2">
                                        <label for="cantidad" class="form-label">Cantidad</label>
                                        <input type="number"
                                               id="cantidad"
                                               name="cantidad"
                                               class="form-control tabular-nums"
                                               value="1"
                                               min="1"
                                               required>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <button type="submit"
                                                class="btn btn-primary add-to-cart w-100"
                                                th:disabled="${#lists.isEmpty(variantesActivas)}">
                                            Agregar al carrito
                                        </button>
                                    </div>
                                </div>
                            </form>

                            <script>
                                document.addEventListener('DOMContentLoaded', function () {
                                    var selectEl = document.getElementById('variante');
                                    var qtyInput = document.getElementById('cantidad');
                                    var pills = document.querySelectorAll('.variant-pill[data-variant-id]');
                                    if (!selectEl) return;

                                    function syncFromSelect() {
                                        var currentVal = selectEl.value;
                                        pills.forEach(function (btn) {
                                            var match = btn.getAttribute('data-variant-id') === currentVal;
                                            btn.setAttribute('aria-pressed', match ? 'true' : 'false');
                                        });
                                        var opt = selectEl.options[selectEl.selectedIndex];
                                        if (opt && qtyInput) {
                                            var maxStock = parseInt(opt.getAttribute('data-stock') || '0', 10);
                                            if (maxStock > 0) {
                                                qtyInput.max = String(maxStock);
                                                if (parseInt(qtyInput.value || '1', 10) > maxStock) {
                                                    qtyInput.value = String(maxStock);
                                                }
                                            }
                                        }
                                    }

                                    pills.forEach(function (btn) {
                                        btn.addEventListener('click', function () {
                                            if (btn.disabled) return;
                                            selectEl.value = btn.getAttribute('data-variant-id');
                                            syncFromSelect();
                                        });
                                    });

                                    selectEl.addEventListener('change', syncFromSelect);
                                });
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
