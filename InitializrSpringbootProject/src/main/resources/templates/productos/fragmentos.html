<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Fitforge</title>
    </head>
    <body>
        <!-- Fragmento para las imágenes a la izquierda -->
        <aside th:fragment="aside" class="aside-images">
            <div class="mb-3">
                <img th:src="@{${producto.imagen}}" alt="Imagen 1" class="img-fluid rounded-4" style="width: 230px; height: 300px; object-fit: cover;">
            </div>

        </aside>

        <!-- Fragmento de detalles del producto -->
        <section th:fragment="product-details" class="product-details-section">
            <div class="container mt-4">
                <div class="row">
                    <div class="col-md-6">
                        <img th:src="@{${producto.imagen}}" alt="Imagen Principal" class="img-fluid rounded-4">
                    </div>
                    <div class="col-md-6">
                        <h1 th:text="${producto.descripcion}">Camiseta Gymshark</h1>
                        <p class="product-price" th:text="'₡ ' + ${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">$25,000.00</p>

                        <!-- Si es admin, mostrar solo botón de editar -->
                        <div th:if="${esAdmin}">
                            <a th:href="@{'/admin/productos/modifica/' + ${producto.idProducto}}" class="btn btn-warning">
                                Editar producto
                            </a>
                        </div>
                        <!-- Si no es admin, mostrar tallas, colores, cantidad y botón agregar al carrito -->
                        <div th:if="${!esAdmin}">
                            <!-- Validación para categoría "Suplementos" (idCategoria = 2) -->
                            <div th:if="${producto.categoria != null and producto.categoria.idCategoria != 2}">
                                <!-- Colores dinámicos -->
                                <div class="product-color">
                                    <h2>Colores disponibles:</h2>
                                    <div class="color-options">
                                        <button th:each="pct : ${producto.productoColorTallas}"
                                                th:class="'color-option ' + ${pct.color != null ? pct.color.nombreColor.toLowerCase() : 'no-color'}"
                                                th:style="'background-color: ' + ${pct.color != null ? pct.color.nombreColor : 'gray'}"
                                                th:title="${pct.color != null ? pct.color.nombreColor : 'Sin color'}">
                                        </button>
                                        <span th:if="${#lists.isEmpty(producto.productoColorTallas)}" class="text-muted">Sin colores disponibles</span>
                                    </div>
                                </div>
                            </div>
                            <!-- Tallas dinámicas -->
                            <div class="product-size">
                                <h2>Tallas disponibles:</h2>
                                <div class="size-options">
                                    <span th:if="${isTallaUnica}" class="badge-talla-unica">
                                        Artículo talla única
                                    </span>
                                    <span th:unless="${isTallaUnica}">
                                        <button th:each="pct : ${producto.productoColorTallas}"
                                                th:if="${pct.talla != null and pct.existencias > 0}"
                                                th:class="'size-option ' + ${pct.talla != null ? pct.talla.nombreTalla : ''}"
                                                th:text="${pct.talla != null ? pct.talla.nombreTalla : ''}">
                                        </button>
                                        <span th:if="${#lists.isEmpty(producto.productoColorTallas) or not hasAvailableTallas}"
                                              class="text-muted">
                                            Sin tallas disponibles
                                        </span>
                                    </span>
                                </div>
                            </div>
                            <!-- Cantidad y botón agregar al carrito -->
                            <div class="product-quantity"></div>
                                <h2>Cantidad</h2>
                                <div class="quantity-control">
                                    <button type="button" class="quantity-btn minus">-</button>
                                    <input type="text" class="quantity-input" value="1" readonly>
                                    <button class="quantity-btn plus">+</button>
                                    <span th:attr="data-stock=${producto.productoColorTallas[0].existencias != null ? producto.productoColorTallas[0].existencias : 0}" style="display:none;"></span>
                                </div>
                            </div>
                            <a th:if="${!#lists.isEmpty(producto.productoColorTallas) and producto.productoColorTallas[0].idProductoColorTalla != null}"
                               th:href="@{'/carrito/agregar/' + ${producto.productoColorTallas[0].idProductoColorTalla}}"
                               class="btn btn-primary add-to-cart">
                                Agregar al carrito
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            </div>
            
            <!-- Script para manejar los botones de cantidad -->
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const minusBtn = document.querySelector('.quantity-btn.minus');
                    const plusBtn = document.querySelector('.quantity-btn.plus');
                    const quantityInput = document.querySelector('.quantity-input');
                    
                    if (minusBtn && plusBtn && quantityInput) {
                        // Evento para el botón menos
                        minusBtn.addEventListener('click', function() {
                            let value = parseInt(quantityInput.value, 10);
                            if (value > 1) {
                                quantityInput.value = value - 1;
                            }
                        });
                        
                        // Evento para el botón más
                        plusBtn.addEventListener('click', function() {
                            let value = parseInt(quantityInput.value, 10);
                            quantityInput.value = value + 1;
                        });
                    }
                });
            </script>
        </section>
    </body>
</html>
