<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{layout/plantilla :: head}">
    <link rel="stylesheet" href="../../static/css/estilos.css" type="text/css"/>

    <title>Fitforge</title>
</head>
<body>
    <aside th:fragment="aside" class="aside-images">
    <!-- Imagen 1 -->
    <div class="mb-3">
        <img src="https://assets.adidas.com/images/w_1880,f_auto,q_auto/8641314128884d00a8faffb46e1427cf_9366/JC5398_21_model.jpg" class="img-fluid rounded-4" style="width: 230px; height: 300px; object-fit: cover;">
    </div>
    <!-- Imagen 2 -->
    <div class="mb-3">
        <img src="https://assets.adidas.com/images/w_1880,f_auto,q_auto/f7dc6b4725464bb490930a9500b73657_9366/JC5398_23_hover_model.jpg" alt="Product Angle 2" class="img-fluid rounded-4" style="width: 230px; height: 300px; object-fit: cover;">
    </div>
    <!-- Imagen 3 -->
    <div>
        <img src="https://assets.adidas.com/images/w_1880,f_auto,q_auto/36c6e81aac7944d583180b1b1fbc5a3e_9366/JC5398_25_model.jpg" alt="Product Angle 3" class="img-fluid rounded-4" style="width: 230px; height: 300px; object-fit: cover;">
    </div>
</aside>

    <!-- Fragmento de detalles del producto -->
    <section th:fragment="product-details" class="product-details-section">
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <img th:src="@{${producto.imagen}}" alt="Product Image" class="img-fluid">
            </div>
            <div class="col-md-6">
                <h1 th:text="${producto.descripcion}">Nombre del Producto</h1>
                <p class="product-price" th:text="'$' + ${producto.precio}"></p>
                
                <!-- Colores dinámicos -->
                <div class="product-color">
                    <h2>Colores disponibles:</h2>
                    <div class="color-options">
                        <button th:each="pct : ${producto.productoColorTallas}"
                                th:class="'color-option ' + ${pct.color != null ? pct.color.nombreColor.toLowerCase() : 'no-color'}"
                                th:style="'background-color: ' + ${pct.color != null ? pct.color.nombreColor : 'gray'}"
                                th:title="${pct.color != null ? pct.color.nombreColor : 'Sin color'}">
                        </button>
                        <!-- Si no hay colores -->
                        <span th:if="${#lists.isEmpty(producto.productoColorTallas)}" 
                              class="text-muted">Sin colores disponibles</span>
                    </div>
                </div>

                <!-- Tallas dinámicas -->
                <div class="product-size">
                    <h2>Tallas disponibles:</h2>
                    <div class="size-options">
                        <button th:each="pct : ${producto.productoColorTallas}"
                                th:class="'size-option ' + ${pct.talla != null ? pct.talla.nombreTalla : ''}"
                                th:text="${pct.talla != null ? pct.talla.nombreTalla : ''}">
                        </button>
                        <!-- Si no hay tallas -->
                        <span th:if="${#lists.isEmpty(producto.productoColorTallas)}" 
                              class="text-muted">Sin tallas disponibles</span>
                    </div>
                </div>

                <!-- Cantidad -->
                <div class="product-quantity">
                    <h2>Cantidad</h2>
                    <div class="quantity-control">
                        <button class="quantity-btn">-</button>
                        <input type="text" class="quantity-input" value="1">
                        <button class="quantity-btn">+</button>
                    </div>
                </div>
                
                <button class="btn btn-primary add-to-cart">Add to Cart</button>
            </div>
        </div>
    </div>
