<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Panel Admin - FitForge</title>
        <style>
            body {
                background-color: #f8f9fa;
                font-family: 'Montserrat', sans-serif;
            }
            .admin-container {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .admin-card {
                max-width: 500px;
                width: 100%;
            }
        </style>
    </head>
    <body sec:authorize="hasRole('ROLE_ADMIN')">
        <div class="admin-container">
            <div class="admin-card card shadow-sm p-4 bg-white rounded">
                <h2 class="text-center fw-bold mb-4">Panel de Administración</h2>
                <p class="text-center text-muted mb-4">Opciones exclusivas para gestionar FitForge</p>
                <ul class="list-group">
                    <li class="list-group-item">
                        <a href="/" class="text-decoration-none text-dark">Inicio - Vista general</a>
                    </li>
                    <li class="list-group-item">
                        <a href="/tienda/listado" class="text-decoration-none text-dark">Tienda - Gestionar productos</a>
                    </li>
                </ul>
                <p class="text-center mt-4">
                    <a href="/" class="btn btn-secondary me-2">Retroceder</a>
                    <a href="/logout" class="btn btn-danger">Cerrar Sesión</a>
                </p>
            </div>
        </div>
    </body>
</html>
