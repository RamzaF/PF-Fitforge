<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Login - FitForge</title>
    </head>
    <body>
        <!-- Header -->
        <header th:replace="~{layout/plantilla :: header}"/>

        <!-- Mensajes -->
        <div th:if="${param.registerSuccess}" class="alert alert-success text-center">
            ¡Registro exitoso! Por favor, inicia sesión.
        </div>
        <div th:if="${param.error}" role="alert" class="alert alert-danger text-center">
            Correo o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-info text-center">
            Has cerrado sesión correctamente.
        </div>
        
        <!-- Hero Section -->
        <section class="position-relative hero-section">
            <!-- Imagen de fondo con overlay para mejor contraste -->
            <div class="hero-bg position-absolute top-0 start-0 w-100" style="min-height: 50vh;">
                <div class="overlay-dark position-absolute top-0 start-0 w-100 h-100"></div>
                <img th:src="@{/Uploads/Banner.PNG}" alt="Background" class="w-100 h-100 object-fit-cover position-absolute top-0 start-0">
            </div>
            <!-- Hero con animación y colores de marca -->
            <div class="position-relative hero-content d-flex align-items-center justify-content-center w-100" style="min-height: 50vh;">
                <div class="container text-center text-white py-5">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <h1 class="display-2 fw-bold mb-3 fade-in">INICIAR SESIÓN</h1>
                            <p class="lead fs-3 mb-4 slide-up">Accede a tu cuenta FitForge y comienza tu experiencia</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de login -->
        <section class="py-5" style="background-color: #D9D9D9; min-height: 100%;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow-sm p-4 bg-white rounded">
                            <h2 class="text-center fw-bold mb-4">Ingresa tus datos</h2>
                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo Electrónico</label>
                                    <input type="email" id="email" name="username" class="form-control" placeholder="ejemplo@fitforge.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <a href="/forgot-password" class="text-primary text-decoration-none">¿Olvidaste tu contraseña?</a>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar Sesión</button>
                            </form>
                            <p class="text-center mt-3">¿No tienes cuenta? <a href="/register" class="text-primary text-decoration-none">Regístrate aquí</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section> 

        <!-- Footer -->
        <footer th:replace="~{layout/plantilla :: footer}"/>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
    </body>
</html>
