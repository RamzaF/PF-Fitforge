<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Iniciar Sesión - FitForge</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"/>

        <main id="mainContent" class="main-container" tabindex="-1">
            <div class="row justify-content-center py-3">
                <div class="col-md-6 col-lg-5">
                    <div th:if="${param.registerSuccess}" class="alert alert-success" role="status">
                        ¡Registro exitoso! Por favor, inicia sesión.
                    </div>
                    <div th:if="${param.error}" role="alert" class="alert alert-danger">
                        Correo o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info" role="status">
                        Has cerrado sesión correctamente.
                    </div>

                    <div class="panel-card">
                        <div class="panel-card__header">
                            <h1 class="panel-card__title h4 mb-0">Iniciar Sesión</h1>
                        </div>
                        <div class="panel-card__body">
                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo Electrónico</label>
                                    <input type="email" id="email" name="username" class="form-control" placeholder="ejemplo@fitforge.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-3 small">
                                    <a href="/forgot-password" class="text-primary text-decoration-none fw-semibold">¿Olvidaste tu contraseña?</a>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                            </form>
                            <p class="text-center small mt-3 mb-0">
                                ¿No tienes cuenta? <a href="/register" class="text-primary text-decoration-none fw-semibold">Regístrate aquí</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/plantilla :: footer}"/>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
    </body>
</html>
