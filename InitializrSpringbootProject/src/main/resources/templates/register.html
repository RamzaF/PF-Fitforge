<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Registro - FitForge</title>
    </head>
    <body>
        <!-- Header -->
        <header th:replace="~{layout/plantilla :: header}"/>
        
        <!-- Hero Section -->
        <section class="position-relative hero-section">
            <div class="hero-bg position-absolute top-0 start-0 w-100" style="min-height: 50vh;">
                <div class="overlay-dark position-absolute top-0 start-0 w-100 h-100"></div>
                <img th:src="@{/uploads/Banner.PNG}" alt="Background" class="w-100 h-100 object-fit-cover position-absolute top-0 start-0">
            </div>
            <div class="position-relative hero-content d-flex align-items-center justify-content-center w-100" style="min-height: 50vh;">
                <div class="container text-center text-white py-5">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <h1 class="display-2 fw-bold mb-3 fade-in">REGÍSTRATE</h1>
                            <p class="lead fs-3 mb-4 slide-up">Únete a FitForge hoy</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de registro -->
        <section class="py-5" style="background-color: #D9D9D9; min-height: 100%;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow-sm p-4 bg-white rounded">
                            <h2 class="text-center fw-bold mb-4">Crea tu cuenta</h2>
                            <form th:action="@{/register}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Nombre de usuario</label>
                                    <input type="text" id="username" name="username" class="form-control" placeholder="Tu usuario" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo Electrónico</label>
                                    <input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@fitforge.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold">Registrarse</button>
                            </form>
                            <p class="text-center mt-3">¿Ya tienes cuenta? <a href="/login" class="text-primary text-decoration-none">Inicia sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section> 

        <!-- Footer -->
        <footer th:replace="~{layout/plantilla :: footer}"/>
    </body>
</html>
