<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Registro - FitForge</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"/>

        <main id="mainContent" class="main-container" tabindex="-1">
            <div class="row justify-content-center py-3">
                <div class="col-md-6 col-lg-5">
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                    <div class="panel-card">
                        <div class="panel-card__header">
                            <h1 class="panel-card__title h4 mb-0">Crear Cuenta</h1>
                        </div>
                        <div class="panel-card__body">
                            <form th:action="@{/register}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Nombre de usuario</label>
                                    <input type="text" id="username" name="username" class="form-control" placeholder="Tu usuario" required>
                                </div>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre" required>
                                </div>
                                <div class="mb-3">
                                    <label for="correo" class="form-label">Correo Electrónico</label>
                                    <input type="email" id="correo" name="correo" class="form-control" placeholder="ejemplo@fitforge.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                            </form>
                            <p class="text-center small mt-3 mb-0">
                                ¿Ya tienes cuenta? <a href="/login" class="text-primary text-decoration-none fw-semibold">Inicia sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/plantilla :: footer}"/>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
    </body>
</html>
