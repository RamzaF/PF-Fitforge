spring.application.name=Fitforge

server.port=8080

# ===============================
# Configuracion de MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/fitforge?useTimezone=true&serverTimezone=UTC
spring.datasource.username=fitforge_user
spring.datasource.password=FitforgeClave123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Mostrar informacion en logs
# ===============================
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE
